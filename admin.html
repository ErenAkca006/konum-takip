<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konum Takip | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root { color-scheme: dark; --bg:#101616; --panel:#182120; --line:#2b3937; --text:#edf5ef; --muted:#91a49d; --accent:#b7ef72; --accent-ink:#15200e; }
    * { box-sizing: border-box; }
    body { margin:0; background: radial-gradient(circle at 80% 0%, #254034 0, transparent 32rem), var(--bg); color:var(--text); font-family:"Space Grotesk", sans-serif; }
    .shell { width:min(1180px, calc(100% - 32px)); margin:0 auto; padding:28px 0 48px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .eyebrow { color:var(--accent); font:500 12px "DM Mono", monospace; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0 0; font-size:clamp(28px, 5vw, 48px); letter-spacing:-.03em; }
    .status { color:var(--muted); font-size:14px; text-align:right; }
    .status strong { color:var(--accent); display:block; margin-bottom:4px; }
    .grid { display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(320px, .65fr); gap:16px; }
    .panel { background:rgba(24,33,32,.9); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .panel-head { display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:16px; }
    .panel-head span { color:var(--muted); font:12px "DM Mono", monospace; }
    #map { min-height:540px; }
    .table-wrap { overflow:auto; max-height:540px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { padding:13px 14px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { color:var(--muted); font:500 11px "DM Mono", monospace; letter-spacing:.08em; text-transform:uppercase; position:sticky; top:0; background:var(--panel); }
    td { color:#dce8df; }
    td.mono { font:12px "DM Mono", monospace; }
    .empty { color:var(--muted); padding:28px 18px; }
    button { border:0; border-radius:5px; background:var(--accent); color:var(--accent-ink); cursor:pointer; font:600 13px "Space Grotesk", sans-serif; padding:9px 13px; }
    button:disabled { cursor:wait; opacity:.6; }
    @media (max-width: 800px) { .shell { width:min(100% - 20px, 680px); padding-top:18px; } header { align-items:start; flex-direction:column; } .status { text-align:left; } .grid { grid-template-columns:1fr; } #map { min-height:360px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Private dashboard</div><h1>Konum akışı</h1></div>
      <div class="status"><strong id="connection">Bağlanıyor...</strong><span id="updated">Henüz yenilenmedi</span></div>
    </header>
    <section class="grid">
      <article class="panel"><div class="panel-head"><h2>Son bilinen konumlar</h2><button id="refresh" type="button">Yenile</button></div><div id="map"></div></article>
      <article class="panel"><div class="panel-head"><h2>Kayıt geçmişi</h2><span id="count">0 kayıt</span></div><div class="table-wrap"><table><thead><tr><th>Zaman</th><th>Koordinat</th><th>Doğruluk</th></tr></thead><tbody id="rows"><tr><td class="empty" colspan="3">Kayıtlar yükleniyor...</td></tr></tbody></table></div></article>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const map = L.map("map").setView([39, 35], 6);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { attribution: "&copy; OpenStreetMap &copy; CARTO" }).addTo(map);
    let markers = L.layerGroup().addTo(map);
    const rows = document.getElementById("rows");
    const connection = document.getElementById("connection");
    const updated = document.getElementById("updated");
    const count = document.getElementById("count");
    const button = document.getElementById("refresh");
    const formatDate = value => value ? new Date(value).toLocaleString("tr-TR") : "-";
    async function refresh() {
      button.disabled = true;
      try {
        const response = await fetch("/api/admin/history", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const records = await response.json();
        markers.clearLayers();
        rows.innerHTML = "";
        count.textContent = `${records.length} kayıt`;
        if (!records.length) {
          rows.innerHTML = '<tr><td class="empty" colspan="3">Henüz konum kaydı yok.</td></tr>';
          connection.textContent = "Bağlı";
        } else {
          const bounds = [];
          records.forEach(record => {
            const point = [record.lat, record.lon];
            bounds.push(point);
            L.marker(point).bindPopup(`<b>${formatDate(record.timestamp)}</b><br>${record.lat.toFixed(6)}, ${record.lon.toFixed(6)}`).addTo(markers);
            const row = document.createElement("tr");
            row.innerHTML = `<td>${formatDate(record.timestamp)}</td><td class="mono">${record.lat.toFixed(6)}, ${record.lon.toFixed(6)}</td><td>${record.accuracy == null ? "-" : `±${Math.round(record.accuracy)} m`}</td>`;
            rows.appendChild(row);
          });
          map.fitBounds(bounds, { padding: [24, 24], maxZoom: 16 });
          connection.textContent = "Canlı bağlantı";
        }
        updated.textContent = `Son yenileme: ${new Date().toLocaleTimeString("tr-TR")}`;
      } catch (error) {
        connection.textContent = "Bağlantı hatası";
        updated.textContent = error.message;
      } finally { button.disabled = false; }
    }
    button.addEventListener("click", refresh);
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
